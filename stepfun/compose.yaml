services:
  seekdb:
    image: ${SEEKDB_IMAGE:-oceanbase/seekdb:latest}
    ports:
      - "127.0.0.1:2881:2881"
    environment:
      ROOT_PASSWORD: ${SEEKDB_PASSWORD:-}
      SEEKDB_DATABASE: ${SEEKDB_DATABASE:-stepfun}
      CPU_COUNT: "2"
      MEMORY_LIMIT: "2G"
      LOG_DISK_SIZE: "2G"
      DATAFILE_SIZE: "2G"
    volumes:
      # seekdb 1.4+ location; Windows needs a Docker-managed volume.
      - seekdb_data:/var/lib/seekdb
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot $${ROOT_PASSWORD:+-p\"$${ROOT_PASSWORD}\"} -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  seekdb_data:
