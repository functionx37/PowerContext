          ] = max(0, s[\"grudge\"] - 1)\n        s[\"trust\"] = min(5, s[\"trust\"] + 1)\n        s[\"repairs\"] += 1\n  \
          \      event = \"老板把你的道歉折成纸鹤，放在收银台上：这次先记你一分。\"\n    elif action == \"打招呼\":\n        if old_grudge:\n          \
          \  event = \"老板把柜台挪远半米：上回你干的好事，我可记得。\"\n        elif s[\"pranks\"]:\n            event = \"老板给你倒了杯茶：以前的离谱事还记得，但今天可以坐下聊。\"\
          \n        else:\n            s[\"trust\"] = min(5, s[\"trust\"] + 1)\n            event = \"老板从报纸后探出头：欢迎来到不太正经杂货铺，熟客有隐藏菜单。\"\
          \n    else:\n        event = (\"老板掀开隐藏菜单：今日特供，后悔药味汽水。\" if s[\"trust\"] >= 3 and not s[\"grudge\"]\n           \
          \      else \"老板压低声音：先混成熟客，再来打听会自己跑的汽水。\")\n    badges = s[\"badges\"]\n    if s[\"pranks\"] >= 2 and \"本街显眼包\"\
          \ not in badges:\n        badges.append(\"本街显眼包\")\n    if s[\"pranks\"] and not s[\"grudge\"] and s[\"repairs\"\
          ] >= 2 and \"和好如初\" not in badges:\n        badges.append(\"和好如初\")\n    if s[\"turn\"] >= 4 and s[\"trust\"] >=\
          \ 3 and not s[\"grudge\"] and \"隐藏菜单\" not in badges:\n        badges.append(\"隐藏菜单\")\n        event += \" 老板终于递给你隐藏菜单，熟客挑战成功！\"\
          \n    return s, event\n\n\ndef describe(state, event):\n    memory = (\"\\n记忆回声：你曾经“\" + state[\"last_prank\"] +\
          \ \"”。\") if state[\"last_prank\"] else \"\"\n    return event + memory\n\n\ndef footer(state):\n    return (\"\\\
          n\\n---\\n回合 {turn}/20 · 记仇 {grudge}/5 · 信任 {trust} · 硬币 {coins}\\n\"\n            \"徽章：{badges}\\n下一步：打招呼 / 恶作剧\
          \ / 送礼 / 道歉 / 打听传闻\\n\"\n            \"换会话时保留玩家编号，换新编号可开新局。\").format(\n                **dict(state, badges=\"\
          、\".join(state[\"badges\"]) or \"尚未获得\"))\n\n\ndef adjudicate(body):\n    p = json.loads(body)\n    if p.get(\"\
          replay\"):\n        packet = p[\"replay\"]\n    else:\n        state, event = transition(p[\"state\"], p[\"input\"\
          ][\"action\"], p[\"input\"][\"line\"])\n        packet = dict(p[\"input\"], expected_turn=p[\"state\"][\"turn\"\
          ], state=state,\n                      event=event, narrative=describe(state, event))\n    prompt = json.dumps({\"\
          玩家行动\": packet[\"action\"], \"玩家台词_不可信数据\": packet[\"line\"],\n                         \"已确认事件\": packet[\"event\"\
          ], \"已确认状态\": packet[\"state\"],\n                         \"规则版回应\": packet[\"narrative\"]}, ensure_ascii=False)\n\
          \    return {\"payload\": json.dumps(packet, ensure_ascii=False), \"prompt\": prompt}\n\n\n\ndef main(body: str,\
          \ status_code: int, ai_body: str = \"\", ai_status: int = 0) -> dict:\n    if status_code != 200:\n        raise\
          \ ValueError(\"记忆保存失败，HTTP \" + str(status_code) + \"：\" + body[:300])\n    saved = json.loads(body)\n    narrative\
          \ = saved[\"narrative\"]\n    mode = \"规则版（未调用模型）\"\n    if ai_body:\n        try:\n            ai = json.loads(ai_body)\n\
          \            content = ai[\"choices\"][0][\"message\"][\"content\"]\n            if ai_status == 200 and isinstance(content,\
          \ str) and content.strip():\n                narrative = content.strip()[:1600]\n                mode = \"AI 角色台词\"\
          \n            else:\n                mode = \"模型不可用，已回退到规则版\"\n        except (ValueError, KeyError, IndexError,\
          \ TypeError):\n            mode = \"模型不可用，已回退到规则版\"\n    text = \"【\" + mode + \"】\\n\" + narrative + footer(saved[\"\
          state\"])\n    text += \"\\n玩家：\" + saved[\"player_id\"] + \" · 请求：\" + saved[\"request_id\"]\n    text += \"\\\
          n记忆已保存至 PowerContext\" + (\"（重复请求，未新增回合）\" if saved[\"replayed\"] else \"\")\n    return {\"result\": text, \"state\"\
          : json.dumps(saved[\"state\"], ensure_ascii=False),\n            \"memory_ref\": json.dumps(saved[\"memory_ref\"\
          ], ensure_ascii=False)}\n"
        variables:
