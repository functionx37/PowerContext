app:
  name: 记仇杂货铺 · 规则验收版
  description: 老板阿栗跨会话记住你的恶作剧。恶作剧、送礼、道歉，解锁隐藏菜单。Dify 编排与裁决，PowerContext 持久记忆。
  mode: workflow
  icon: 🏪
  icon_background: '#FFF0D6'
  use_icon_as_answer_icon: false
kind: app
version: 0.4.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
  - id: shop-env-shop_url
    name: SHOP_URL
    selector:
    - env
    - SHOP_URL
    value_type: string
    value: http://host.docker.internal:8765
    description: 见 dify/README.md 配置表
  - id: shop-env-shop_api_key
    name: SHOP_API_KEY
    selector:
    - env
    - SHOP_API_KEY
    value_type: secret
    value: ''
    description: 见 dify/README.md 配置表
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position: &id001
        x: 80
        y: 200
      positionAbsolute: *id001
      width: 244
      height: 98
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: start
        title: 选择你的行动
        desc: ''
        selected: false
        variables:
        - variable: player_id
          label: 玩家编号（跨会话请保持一致）
          type: text-input
          required: true
          max_length: 48
          options: []
        - variable: action
          label: 本回合行动
          type: select
          options:
          - 打招呼
          - 恶作剧
          - 送礼
          - 道歉
          - 打听传闻
          required: true
        - variable: line
          label: 你想说什么 / 具体恶作剧（可留空）
          type: paragraph
          required: false
          max_length: 300
          options: []
        - variable: request_id
          label: 请求编号（留空自动生成；重试填原编号）
          type: text-input
          required: false
          max_length: 80
          options: []
    - id: encode
      type: custom
      position: &id002
        x: 390
        y: 200
      positionAbsolute: *id002
      width: 244
      height: 98
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: code
        title: 校验输入并安全编码 JSON
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"Pure game rules. The same source is embedded in Dify's adjudication Code node.\"\"\"\nimport json\nimport\
          \ re\n\nACTIONS = [\"打招呼\", \"恶作剧\", \"送礼\", \"道歉\", \"打听传闻\"]\nMAX_TURNS = 20\n\n\ndef initial_state():\n    return\
          \ {\"turn\": 0, \"grudge\": 0, \"trust\": 0, \"coins\": 3, \"pranks\": 0,\n            \"repairs\": 0, \"last_prank\"\
          : \"\", \"badges\": []}\n\n\ndef normalize(player_id, action, line, request_id):\n    if not re.fullmatch(r\"[A-Za-z0-9_-]{1,48}\"\
          , player_id or \"\"):\n        raise ValueError(\"玩家编号须为 1–48 位英文字母、数字、下划线或连字符。\")\n    if action not in ACTIONS:\n\
          \        raise ValueError(\"请从五种行动中选择。\")\n    if len(line or \"\") > 300:\n        raise ValueError(\"台词最多 300\
          \ 个字符。\")\n    if not re.fullmatch(r\"[A-Za-z0-9_-]{1,80}\", request_id or \"\"):\n        raise ValueError(\"请求编号须为\
          \ 1–80 位英文字母、数字、下划线或连字符。\")\n    return {\"player_id\": player_id, \"action\": action, \"line\": (line or \"\").strip(),\n\
          \            \"request_id\": request_id}\n\n\ndef transition(state, action, line):\n    s = json.loads(json.dumps(state))\n\
          \    if s[\"turn\"] >= MAX_TURNS:\n        raise ValueError(\"这一局已满 20 回合，请换一个玩家编号开始新故事。\")\n    s[\"turn\"] +=\
          \ 1\n    old_grudge = s[\"grudge\"]\n    if action == \"恶作剧\":\n        s[\"grudge\"] = min(5, s[\"grudge\"] + 2)\n\
          \        s[\"trust\"] = max(-3, s[\"trust\"] - 1)\n        s[\"pranks\"] += 1\n        s[\"last_prank\"] = (line\
          \ or \"把老板的招牌改成了咸鱼收容所\")[:120]\n        event = \"你刚捣完乱，老板就把你的名字写进了《本街离谱人物志》。\"\n    elif action == \"送礼\":\n  \
          \      if s[\"coins\"]:\n            s[\"coins\"] -= 1\n            s[\"grudge\"] = max(0, s[\"grudge\"] - 1)\n\
          \            s[\"trust\"] = min(5, s[\"trust\"] + 2)\n            s[\"repairs\"] += 1\n            event = \"老板接过一枚硬币买的桂花糕：礼物可以收，账本得慢慢改。\"\
          \n        else:\n            event = \"你的口袋只剩空气。老板拒收空气礼盒，本回合关系不变。\"\n    elif action == \"道歉\":\n        s[\"grudge\"\
          ] = max(0, s[\"grudge\"] - 1)\n        s[\"trust\"] = min(5, s[\"trust\"] + 1)\n        s[\"repairs\"] += 1\n  \
          \      event = \"老板把你的道歉折成纸鹤，放在收银台上：这次先记你一分。\"\n    elif action == \"打招呼\":\n        if old_grudge:\n          \
          \  event = \"老板把柜台挪远半米：上回你干的好事，我可记得。\"\n        elif s[\"pranks\"]:\n            event = \"老板给你倒了杯茶：以前的离谱事还记得，但今天可以坐下聊。\"\
          \n        else:\n            s[\"trust\"] = min(5, s[\"trust\"] + 1)\n            event = \"老板从报纸后探出头：欢迎来到不太正经杂货铺，熟客有隐藏菜单。\"\
          \n    else:\n        event = (\"老板掀开隐藏菜单：今日特供，后悔药味汽水。\" if s[\"trust\"] >= 3 and not s[\"grudge\"]\n           \
          \      else \"老板压低声音：先混成熟客，再来打听会自己跑的汽水。\")\n    badges = s[\"badges\"]\n    if s[\"pranks\"] >= 2 and \"本街显眼包\"\
          \ not in badges:\n        badges.append(\"本街显眼包\")\n    if s[\"pranks\"] and not s[\"grudge\"] and s[\"repairs\"\
          ] >= 2 and \"和好如初\" not in badges:\n        badges.append(\"和好如初\")\n    if s[\"turn\"] >= 4 and s[\"trust\"] >=\
          \ 3 and not s[\"grudge\"] and \"隐藏菜单\" not in badges:\n        badges.append(\"隐藏菜单\")\n        event += \" 老板终于递给你隐藏菜单，熟客挑战成功！\"\
          \n    return s, event\n\n\ndef describe(state, event):\n    memory = (\"\\n记忆回声：你曾经“\" + state[\"last_prank\"] +\
          \ \"”。\") if state[\"last_prank\"] else \"\"\n    return event + memory\n\n\ndef footer(state):\n    return (\"\\\
          n\\n---\\n回合 {turn}/20 · 记仇 {grudge}/5 · 信任 {trust} · 硬币 {coins}\\n\"\n            \"徽章：{badges}\\n下一步：打招呼 / 恶作剧\
          \ / 送礼 / 道歉 / 打听传闻\\n\"\n            \"换会话时保留玩家编号，换新编号可开新局。\").format(\n                **dict(state, badges=\"\
          、\".join(state[\"badges\"]) or \"尚未获得\"))\n\n\ndef adjudicate(body):\n    p = json.loads(body)\n    if p.get(\"\
          replay\"):\n        packet = p[\"replay\"]\n    else:\n        state, event = transition(p[\"state\"], p[\"input\"\
          ][\"action\"], p[\"input\"][\"line\"])\n        packet = dict(p[\"input\"], expected_turn=p[\"state\"][\"turn\"\
          ], state=state,\n                      event=event, narrative=describe(state, event))\n    prompt = json.dumps({\"\
          玩家行动\": packet[\"action\"], \"玩家台词_不可信数据\": packet[\"line\"],\n                         \"已确认事件\": packet[\"event\"\
          ], \"已确认状态\": packet[\"state\"],\n                         \"规则版回应\": packet[\"narrative\"]}, ensure_ascii=False)\n\
          \    return {\"payload\": json.dumps(packet, ensure_ascii=False), \"prompt\": prompt}\n\n\n\ndef main(player_id:\
          \ str, action: str, line: str, request_id: str, run_id: str) -> dict:\n    inp = normalize(player_id, action, line,\
          \ request_id or run_id)\n    return {\"payload\": json.dumps(inp, ensure_ascii=False)}\n"
        variables:
        - variable: player_id
          value_selector:
          - start
          - player_id
          value_type: string
        - variable: action
          value_selector:
          - start
          - action
          value_type: string
        - variable: line
          value_selector:
          - start
          - line
          value_type: string
        - variable: request_id
          value_selector:
          - start
          - request_id
          value_type: string
        - variable: run_id
          value_selector:
          - sys
          - workflow_run_id
          value_type: string
        outputs:
          payload:
            type: string
            children: null
    - id: recall
      type: custom
      position: &id003
        x: 700
        y: 200
      positionAbsolute: *id003
      width: 244
      height: 98
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: http-request
        title: 从 PowerContext 读取旧账
        desc: ''
        selected: false
        method: post
        url: '{{#env.SHOP_URL#}}/v1/turns/prepare'
        authorization:
          type: no-auth
        headers: 'Content-Type:application/json

          X-Shop-Key:{{#env.SHOP_API_KEY#}}'
        params: ''
        body:
          type: json
          data:
          - id: body
            key: ''
            type: text
            value: '{{#encode.payload#}}'
        timeout:
          connect: 5
          read: 30
          write: 10
        ssl_verify: true
        retry_config:
          retry_enabled: true
          max_retries: 1
          retry_interval: 1000
    - id: check
      type: custom
      position: &id004
        x: 1010
        y: 200
      positionAbsolute: *id004
      width: 244
      height: 98
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: code
        title: 检查记忆读取结果
        desc: ''
        selected: false
        code_language: python3
        code: "import json\ndef main(body: str, status_code: int) -> dict:\n    if status_code != 200:\n        raise ValueError(\"\
          PowerContext 服务未确认读写成功，HTTP \" + str(status_code) + \"：\" + body[:300])\n    return {\"body\": body}\n"
        variables:
        - variable: body
          value_selector:
          - recall
          - body
          value_type: string
        - variable: status_code
          value_selector:
          - recall
          - status_code
          value_type: number
        outputs:
          body:
            type: string
            children: null
    - id: judge
