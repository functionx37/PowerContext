    - id: save
      type: custom
      position: &id006
        x: 1630
        y: 200
      positionAbsolute: *id006
      width: 244
      height: 98
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        type: http-request
        title: 将本回合写入 PowerContext
        desc: ''
        selected: false
        method: post
        url: '{{#env.SHOP_URL#}}/v1/turns/commit'
        authorization:
          type: no-auth
        headers: 'Content-Type:application/json

